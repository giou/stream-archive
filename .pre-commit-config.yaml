# The hooks run the project's tools through uv, so a commit checks the same
# tools and versions that CI checks. The versions come from uv.lock, and
# Dependabot keeps them current through the uv ecosystem.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        args: [--fix]
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
      - id: mypy
        name: mypy
        # The scope comes from [tool.mypy] files in pyproject.toml.
        entry: uv run --frozen mypy
        language: system
        pass_filenames: false
        types_or: [python, pyi]
        require_serial: true
