[project]
name = "twitch-recorder"
version = "1.0.0"
description = "Twitch channel monitor and recorder"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "python-telegram-bot>=20.0",
    "streamlink>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
