[build-system]
# hatchling >= 1.27 accepts the SPDX string form of `license` (PEP 639), and
# <3 keeps an untested major out of the isolated build environment.
requires = ["hatchling>=1.27,<3"]
build-backend = "hatchling.build"

[project]
name = "stream-archive"
version = "1.2.7"
description = "StreamArchive - Twitch and Kick stream monitor, recorder, and YouTube restreamer"
readme = "README.md"
license = "MIT"
# 3.15 is not validated yet. The cap fails an install on an untested
# interpreter instead of failing at runtime. uv.lock records the same bound.
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.27",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "python-telegram-bot>=20.0",
    "streamlink>=8.4.0",
    "telethon>=1.44",
    "packaging>=24",
    "websockets>=14",
    "aiohttp>=3.9",
    "cryptography>=42.0",
    "pydantic>=2.13.4",
]

[project.scripts]
stream-archive = "stream_archive.scheduler:main"
stream-archive-setup-youtube = "stream_archive.setup_youtube:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # Third-party deprecations on a new interpreter floor are not ours to fix,
    # and the list of them is open (every dependency and its own dependencies).
    # The blanket ignores drop them, and the entries below keep our modules
    # strict, so a new warning from our own code still fails. FutureWarning and
    # PendingDeprecationWarning are separate classes, so each needs its own
    # pair of entries.
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
    "error::DeprecationWarning:stream_archive.*",
    "error::PendingDeprecationWarning:stream_archive.*",
    "error::FutureWarning:stream_archive.*",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["plugins", "vendor"]  # dev-only plugin dir, and the vendored upstream plugin

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TRY", "EM", "RUF100", "TID"]
ignore = [
    "E501",  # ruff-format wraps code, but long strings and URLs legitimately exceed
    # Validation raises carry messages by design (config validators, notifier): message-less raises hide the cause.
    "TRY003",
    # logger.error with exc_info keeps the call-site level: exception() forces ERROR level name only.
    "TRY400",
    # Boolean/coercion validators raise ValueError uniformly: callers catch ValueError, not TypeError.
    "TRY004",
]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
files = ["src/stream_archive"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = false
warn_return_any = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.*"]
ignore_missing_imports = true  # no stubs or py.typed marker upstream

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
