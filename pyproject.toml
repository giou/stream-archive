[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stream-archive"
version = "1.1.2"
description = "StreamArchive - Twitch and Kick stream monitor, recorder, and YouTube restreamer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "python-telegram-bot>=20.0",
    "streamlink>=8.4.0",
    "packaging>=24",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "cryptography>=42.0",
    "pydantic>=2.13.4",
]

[project.scripts]
stream-archive = "stream_archive.scheduler:main"
stream-archive-setup-youtube = "stream_archive.setup_youtube:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["plugins"]   # dev-only plugin dir, not shipped in this repo

select = ["E", "F", "I", "UP", "B", "SIM", "TRY", "EM", "RUF100", "TID"]
ignore = [
    "E501",  # ruff-format wraps code, but long strings and URLs legitimately exceed
    # Validation raises carry messages by design (config validators, notifier): message-less raises hide the cause.
    "TRY003",
    # logger.error with exc_info keeps the call-site level: exception() forces ERROR level name only.
    "TRY400",
    # Boolean/coercion validators raise ValueError uniformly: callers catch ValueError, not TypeError.
    "TRY004",
]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
files = ["src/stream_archive"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = false
warn_return_any = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_errors = true           # google-auth ships partial stubs with untyped methods

[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.flow"]
ignore_missing_imports = true  # no stubs or py.typed marker upstream

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
