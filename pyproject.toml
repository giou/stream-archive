[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stream-archive"
version = "1.0.8"
description = "StreamArchive - Twitch and Kick stream monitor, recorder, and YouTube restreamer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "python-telegram-bot>=20.0",
    "streamlink>=8.4.0",
    "packaging>=24",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "cryptography>=42.0",
    "pydantic>=2.13.4",
]

[project.scripts]
stream-archive = "stream_archive.scheduler:main"
stream-archive-setup-youtube = "stream_archive.setup_youtube:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["plugins"]   # dev-only plugin dir, not shipped in this repo

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]              # ruff-format wraps code; strings/URLs legitimately exceed

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
files = ["src/stream_archive"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_return_any = false        # untyped third-party APIs (streamlink/httpx) return Any; avoid noise in glue code
show_error_codes = true

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_errors = true           # google-auth ships partial stubs with untyped methods

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
