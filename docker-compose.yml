services:
  stream-archive:
    image: ghcr.io/giou/stream-archive:latest
    restart: unless-stopped
    init: true                     # tini: zombie reaping + SIGTERM forwarding
    # No `user:` key. The entrypoint runs the app as the data-dir owner's
    # uid/gid, so deployments work on hosts where the user's uid != 1000.
    # Force a specific identity with USER_UID/USER_GID in `.env` below.
    working_dir: /data
    volumes:
      # All state lives in the data dir: config.json, recordings/, chat/,
      # tokens, update_state.json. The default is the folder containing this
      # compose file. Override it with STREAM_ARCHIVE_DATA in .env.
      - ${STREAM_ARCHIVE_DATA:-.}:/data
      # Host tailscale runtime directory. It lets the bot run `tailscale
      # funnel` for the kick webhook tunnel. The mount is optional: the stack
      # boots when tailscale is absent, because compose creates an empty
      # directory. An empty directory is what tailscaled creates too. Set
      # TAILSCALE_RUN_DIR when the host uses another path.
      # The mount is read-write: a unix socket needs write access to connect,
      # and the container can change the host tailnet (funnel/serve config,
      # routes). Trust the container as the host user. The socket is usually
      # root:root mode 0600, so set USER_UID/USER_GID to a user that may write
      # to it, or run
      # `sudo chmod 0660 /var/run/tailscale/tailscaled.sock` on the host.
      - ${TAILSCALE_RUN_DIR:-/var/run/tailscale}:/var/run/tailscale
      # /tmp is the only scratch space (HOME and the streamlink plugin cache
      # too), so cap it: without a limit a leaked file can consume half of the
      # host RAM. The size is in bytes. Write the mode as an octal literal
      # (0o1777) to keep /tmp world-writable for the dropped uid: compose
      # passes a plain number to the kernel as an octal string, so `mode: 1777`
      # gives mode 3361 instead.
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 1073741824
          mode: 0o1777
    ports:
      # Kick webhook receiver and control API (/api/v1, same listener). The
      # host's tailscale funnel forwards to the host loopback, so we publish
      # the container listener there. This needs
      # kick.webhook.listen_host = "0.0.0.0" in config.json under docker.
      - "127.0.0.1:8787:8787"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - TZ=${TZ:-UTC}
      - USER_UID=${USER_UID:-}
      - USER_GID=${USER_GID:-}
    # The image owns all code. The rootfs is read-only, and only the data dir
    # and /tmp (tmpfs, above) are writable.
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 90s         # graceful shutdown stops recordings + ends YouTube broadcasts
