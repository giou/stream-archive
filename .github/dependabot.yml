version: 2
updates:
  # The app and its tools ship in the image, so every ecosystem below feeds
  # the same release. CI gates each pull request on the uv and github-actions
  # ecosystems (uv sync --locked, ruff format --check, ruff check, mypy,
  # pytest). The docker ecosystem has no such gate, so the image job of ci.yml
  # builds the image for a Dependabot pull request.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
  # Dockerfile base images: python, uv. The workflows read the uv tag from
  # the Dockerfile at runtime, so a uv bump needs no other change.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5
    # The cap `requires-python = ">=3.14,<3.15"` keeps the app off 3.15 until
    # that interpreter is validated. Dependabot reads the Python tag as
    # semver, so it offers 3.15 as a minor bump. Skip it here; patch updates
    # of the 3.14 series still arrive.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
        # Majors arrive as their own pull request, as in the uv block below: a
        # broken base major would otherwise hold back the other two images.
        update-types: ["minor", "patch"]
  # Python dependencies from uv.lock (streamlink, aiohttp, pydantic, ...).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 5
    groups:
      uv:
        patterns: ["*"]
        # Majors arrive as their own pull request. Dependabot rebuilds a group
        # as a whole, so one broken major would hold back every other update of
        # the ecosystem.
        update-types: ["minor", "patch"]
