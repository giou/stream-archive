version: 2
updates:
  # The app and its tools ship in the image, so every ecosystem below feeds
  # the same release. CI gates each pull request on the uv and github-actions
  # ecosystems (uv sync --locked, ruff format --check, ruff check, mypy,
  # pytest). It does not build the image: publish.yml builds it on a v* tag,
  # so review a docker bump by eye.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
  # Dockerfile base images: python, cloudflared, uv.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ["*"]
  # Python dependencies from uv.lock (streamlink, aiohttp, pydantic, ...).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      uv:
        patterns: ["*"]
        # Majors arrive as their own pull request. Dependabot rebuilds a group
        # as a whole, so one broken major would hold back every other update of
        # the ecosystem.
        update-types: ["minor", "patch"]
