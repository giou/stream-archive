name: publish
on:
  push:
    tags: ["v*"]
concurrency:
  # One group for every tag, so two tag pushes serialize instead of racing on
  # the shared :latest image tag.
  group: publish
  cancel-in-progress: false
# Only the release job writes. The test job runs third-party install scripts,
# so it stays read-only.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # Same uv version as the image build (Dockerfile uv stage).
          version: "0.12.15"
          python-version: "3.14"
          enable-cache: true
          # The cache key tracks the lockfile and the project metadata.
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Install ffmpeg (runtime dep; hold/reuse tests spawn it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
  release:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # This job starts on a bare runner, so it has no interpreter of its own.
      # Pin one: tomllib needs Python 3.11, and the runner's python3 can change
      # between images.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7
        with:
          python-version: "3.14"
      - name: Assert tag matches pyproject version
        run: |
          V=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ -z "$V" ]; then
            echo "cannot read project.version from pyproject.toml" >&2; exit 1
          fi
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != v$V" >&2; exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the newest streamlink-ttvlol release
        id: ttvlol
        run: |
          # The plugin repository is public, so the unauthenticated endpoint
          # answers. GITHUB_TOKEN is scoped to this repository and cannot read
          # another one, so `gh` would always fail here.
          TAG=$(curl -fsSL https://api.github.com/repos/2bc4/streamlink-ttvlol/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          if [ -z "$TAG" ]; then
            echo "cannot resolve the streamlink-ttvlol tag" >&2; exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v?[0-9A-Za-z._-]+$'; then
            echo "unexpected streamlink-ttvlol tag: $TAG" >&2; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Resolve the image tags
        id: image
        run: |
          # A "-" in the tag marks a prerelease (semver), so it does not move
          # :latest. The assert step ties the tag to the pyproject version, so
          # no date-style tag reaches this rule. The list holds only real tags:
          # an empty entry would reach the builder as an empty --tag.
          TAGS="ghcr.io/giou/stream-archive:${GITHUB_REF_NAME}"
          case "${GITHUB_REF_NAME}" in
            *-*) ;;
            *) TAGS="${TAGS}"$'\n'"ghcr.io/giou/stream-archive:latest" ;;
          esac
          {
            echo "tags<<EOF"
            printf '%s\n' "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TTVLOL_PLUGIN_VERSION=${{ steps.ttvlol.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.image.outputs.tags }}
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            docker-compose.yml
            config.json.example
