name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Install ffmpeg (runtime dep; hold/reuse tests spawn it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
  release:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert tag matches pyproject version
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != v$V" >&2; exit 1
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the newest streamlink-ttvlol release
        id: ttvlol
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo 2bc4/streamlink-ttvlol --json tagName --jq .tagName || true)
          if [ -z "$TAG" ]; then
            echo "cannot resolve the streamlink-ttvlol tag; the build resolves latest" >&2
            TAG=latest
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TTVLOL_PLUGIN_VERSION=${{ steps.ttvlol.outputs.tag }}
          tags: |
            ghcr.io/giou/stream-archive:${{ github.ref_name }}
            ghcr.io/giou/stream-archive:latest
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            docker-compose.yml
            config.json.example
