name: publish
on:
  push:
    tags: ["v*"]
concurrency:
  # One group for every tag, so two tag pushes serialize instead of racing on
  # the shared :latest image tag. Serialization alone does not keep an older
  # re-run from moving :latest, so the tag step also compares versions.
  group: publish
  cancel-in-progress: false
# Only the release job writes. The test job runs third-party install scripts,
# so it stays read-only.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Same uv version as the image build (Dockerfile uv stage).
          version: "0.12.15"
          python-version: "3.14"
          enable-cache: true
          # The cache key tracks the lockfile and the project metadata.
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Install ffmpeg (runtime dep; hold/reuse tests spawn it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
  release:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # This job starts on a bare runner, so it has no interpreter of its own.
      # Pin one: tomllib needs Python 3.11, and the runner's python3 can change
      # between images.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Assert tag matches pyproject version
        run: |
          V=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ -z "$V" ]; then
            echo "cannot read project.version from pyproject.toml" >&2; exit 1
          fi
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != v$V" >&2; exit 1
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the image tags
        id: image
        shell: bash
        env:
          IMAGE: ghcr.io/giou/stream-archive
        run: |
          # Only a stable tag moves :latest. A PEP 440 prerelease (1.0rc1) and a
          # hyphenated semver prerelease (1.0-rc1) both have a non-numeric
          # version, so the pattern below rejects both. The assert step ties the
          # tag to the pyproject version. The list holds only real tags: an empty
          # entry would reach the builder as an empty --tag.
          TAGS="${IMAGE}:${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            # :latest follows the newest stable release. The published tags come
            # from the registry, because a re-run of an older tag would
            # otherwise move :latest backwards.
            REPOSITORY="${IMAGE#ghcr.io/}"
            TOKEN=$(curl -fsS --retry 3 --max-time 60 \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPOSITORY}:pull" | jq -r .token)
            PUBLISHED=$(curl -fsS --retry 3 --max-time 60 -H "Authorization: Bearer ${TOKEN}" \
              "https://ghcr.io/v2/${REPOSITORY}/tags/list?n=1000" | jq -r '.tags[]?' \
              | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -1)
            NEWEST=$(printf '%s\n' "$PUBLISHED" "${GITHUB_REF_NAME}" | sort -V | tail -1)
            if [ "$NEWEST" = "${GITHUB_REF_NAME}" ]; then
              TAGS="${TAGS}"$'\n'"${IMAGE}:latest"
            else
              echo "::warning::${GITHUB_REF_NAME} is not newer than ${PUBLISHED}, so :latest stays there" >&2
            fi
          fi
          {
            echo "tags<<EOF"
            printf '%s\n' "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.image.outputs.tags }}
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          files: |
            docker-compose.yml
            config.json.example
