name: ci
on:
  push:
    branches: [main, master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          # Same uv version as the image build (Dockerfile uv stage).
          version: "0.12.13"
          python-version: "3.14"
          enable-cache: true
          # The cache key tracks the lockfile and the project metadata.
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - name: Install ffmpeg (runtime dep; hold/reuse tests spawn it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
